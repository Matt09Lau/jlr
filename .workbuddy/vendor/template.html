<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSPP ｜ 主数据前端设计稿（配件 / 仓库 / 经销商 / 供应商 / 替代链）</title>
<style>__VENDOR_RESET__</style>
<style>
  html,body{height:100%;margin:0;background:#eff1f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;}
  #app{height:100%;}
  .layout-root{display:flex;flex-direction:column;height:100vh;min-width:1180px;overflow:hidden;}

  /* ===== 顶部栏 ===== */
  .top-bar{height:46px;background:#10233f;display:flex;align-items:center;flex-shrink:0;user-select:none;}
  .top-tabs{display:flex;align-items:stretch;height:100%;}
  .top-tab{display:flex;align-items:center;gap:6px;padding:0 18px;color:rgba(255,255,255,.72);cursor:pointer;font-size:13px;}
  .top-tab:hover{color:#fff;}
  .top-tab.active{color:#fff;background:#1677ff;}
  .top-tab .tab-x{font-size:10px;opacity:.7;}
  .top-right{margin-left:auto;display:flex;align-items:center;gap:20px;color:rgba(255,255,255,.85);font-size:13px;padding-right:16px;}
  .top-right .item{cursor:pointer;display:flex;align-items:center;gap:5px;}
  .top-right .item:hover{color:#fff;}
  .avatar{width:24px;height:24px;border-radius:50%;background:#1677ff;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;}

  /* ===== 左侧菜单 ===== */
  .body-wrap{flex:1;display:flex;min-height:0;}
  .side-menu{width:210px;background:#fff;border-right:1px solid #e8ecf1;display:flex;flex-direction:column;flex-shrink:0;transition:width .2s;}
  .side-menu.collapsed{width:52px;}
  .logo-row{height:56px;display:flex;align-items:center;justify-content:center;gap:10px;border-bottom:1px solid #f0f2f5;cursor:pointer;}
  .logo-jlr{font-size:24px;font-weight:800;letter-spacing:2px;color:#111;font-family:Georgia,"Times New Roman",serif;font-style:italic;}
  .logo-jlrs{font-size:14px;font-weight:700;color:#1677ff;}
  .logo-jlrs .caret{font-size:10px;color:#999;}
  .menu-search{padding:10px 12px;}
  .menu-scroll{flex:1;overflow-y:auto;padding-bottom:8px;}
  .menu-scroll::-webkit-scrollbar{width:4px;}
  .menu-scroll::-webkit-scrollbar-thumb{background:#d9d9d9;border-radius:2px;}
  .menu-group{padding:10px 16px 6px;color:#1677ff;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;cursor:pointer;}
  .menu-group .g-caret{margin-left:auto;font-size:10px;color:#999;transition:transform .2s;}
  .menu-group .g-caret.open{transform:rotate(180deg);}
  .menu-item{padding:9px 16px 9px 36px;font-size:13px;color:rgba(0,0,0,.72);cursor:pointer;display:flex;align-items:center;gap:8px;position:relative;}
  .menu-item:hover{background:#f5f7fa;color:#1677ff;}
  .menu-item.active{background:#e6f4ff;color:#1677ff;font-weight:600;}
  .menu-item.active::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:#1677ff;}
  .menu-item .ico{width:16px;text-align:center;font-size:13px;}
  .menu-item .arrow{margin-left:auto;font-size:10px;color:#bbb;}
  .menu-foot{border-top:1px solid #f0f2f5;padding:11px 16px;font-size:12px;color:rgba(0,0,0,.5);cursor:pointer;display:flex;align-items:center;gap:8px;}
  .menu-foot:hover{color:#1677ff;}

  /* ===== 主区域 ===== */
  .main-area{flex:1;display:flex;flex-direction:column;min-width:0;position:relative;overflow:hidden;}
  .crumb-bar{background:#fff;padding:10px 18px 0;font-size:13px;color:rgba(0,0,0,.45);flex-shrink:0;}
  .crumb-bar .cur{color:rgba(0,0,0,.85);}
  .page-scroll{flex:1;overflow-y:auto;padding:12px 18px 24px;}
  .page-scroll::-webkit-scrollbar{width:6px;}
  .page-scroll::-webkit-scrollbar-thumb{background:#d9d9d9;border-radius:3px;}

  .card{background:#fff;border-radius:6px;box-shadow:0 1px 2px rgba(0,0,0,.04);padding:16px 18px;margin-bottom:12px;}

  /* 筛选区 */
  .filter-row{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;}
  .filter-items{display:flex;flex-wrap:wrap;gap:12px 32px;flex:1;}
  .f-item{display:flex;align-items:center;gap:8px;}
  .f-label{color:rgba(0,0,0,.72);font-size:13px;}
  .f-label .q{color:#1677ff;cursor:pointer;font-size:12px;border:1px solid #91caff;border-radius:50%;width:15px;height:15px;line-height:13px;display:inline-block;text-align:center;margin-left:2px;}
  .filter-actions{display:flex;align-items:center;gap:14px;}
  .filter-actions .act{cursor:pointer;color:rgba(0,0,0,.6);font-size:16px;display:flex;align-items:center;gap:3px;}
  .filter-actions .act:hover{color:#1677ff;}
  .filter-actions .act .txt{font-size:13px;}

  /* 工具条 */
  .toolbar-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .toolbar-icons{margin-left:auto;display:flex;gap:14px;color:rgba(0,0,0,.55);font-size:15px;}
  .toolbar-icons span{cursor:pointer;}
  .toolbar-icons span:hover{color:#1677ff;}

  /* 表格 */
  .col-chip{display:inline-block;min-width:20px;text-align:center;border-radius:4px;color:#fff;font-weight:700;font-size:12px;line-height:18px;padding:0 4px;}
  .link-btn{color:#1677ff;cursor:pointer;padding:0 3px;font-size:12px;}
  .link-btn.danger{color:#ff4d4f;}
  .danger{color:#ff4d4f;cursor:pointer;}
  .link-btn:hover{text-decoration:underline;}
  .mini-tag{font-size:11px;color:rgba(0,0,0,.45);background:#fafafa;border:1px solid #f0f0f0;border-radius:4px;padding:0 5px;margin-left:5px;}
  .pager-row{display:flex;justify-content:flex-end;align-items:center;gap:14px;margin-top:14px;}
  .pager-row .total{color:rgba(0,0,0,.45);font-size:13px;}

  /* 水印 */
  .watermark{position:absolute;inset:0;pointer-events:none;z-index:900;overflow:hidden;}
  .watermark span{position:absolute;color:rgba(0,0,0,.04);font-size:13px;transform:rotate(-24deg);white-space:nowrap;font-weight:600;}

  .rule-steps{display:flex;gap:8px;margin:14px 0;}
  .rule-step{flex:1;border-radius:6px;padding:10px;text-align:center;color:#fff;}
  .rule-step .r{font-size:16px;font-weight:700;}
  .rule-step .t{font-size:12px;opacity:.92;}
  .col-set-item{display:flex;align-items:center;gap:8px;padding:5px 4px;}

  /* 收发管控 表单（仿 JLRS 新增/编辑页版式） */
  .blk-section{font-weight:600;font-size:14px;color:#1f1f1f;border-left:3px solid #1677ff;padding-left:8px;margin-bottom:14px;}
  .blk-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 28px;}
  .blk-field{min-width:0;}
  .blk-label{font-size:13px;color:#606060;margin-bottom:6px;}
  .blk-label i{color:#ff4d4f;font-style:normal;margin-right:2px;font-weight:600;}
  .blk-form-actions{display:flex;gap:8px;margin-bottom:16px;}
  .blk-preview{background:#f6f8fa;border:1px solid #e5e7eb;border-radius:6px;padding:10px 12px;font-size:13px;color:#4b5563;margin-top:14px;}
  .blk-preview b{color:#1677ff;}
  .blk-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:24px;}
  .blk-hint{background:#fafafa;border:1px solid #f0f0f0;border-radius:6px;padding:8px 12px;font-size:13px;color:#595959;margin-bottom:16px;line-height:1.7;}
  .sel-bar{display:flex;align-items:center;justify-content:space-between;background:#e6f4ff;border:1px solid #91caff;border-radius:6px;padding:8px 12px;margin-bottom:12px;}
  .sel-bar .sel-txt{font-size:13px;color:#1f1f1f;}
  .sel-bar .sel-txt b{color:#1677ff;}
  .ph-wrap{display:flex;gap:14px;align-items:stretch;padding:14px;}
  .ph-tree{flex:0 0 40%;min-width:320px;max-width:460px;border-right:1px solid #f0f0f0;padding-right:12px;overflow:auto;max-height:72vh;}
  .ph-tree-title{font-weight:600;font-size:13px;color:#1f1f1f;margin-bottom:10px;}
  .ph-detail{flex:1;min-width:0;padding-left:4px;overflow:auto;max-height:72vh;}
  .ph-empty{display:flex;align-items:center;justify-content:center;height:100%;min-height:260px;}
  .ph-tree-body{max-height:70vh;overflow:auto;}
  .tnode{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:13px;color:#1f1f1f;}
  .tnode:hover{background:#f5f8ff;}
  .tnode.sel{background:#e6f4ff;}
  .tnode-sw{width:16px;text-align:center;color:#8c8c8c;user-select:none;flex:none;}
  .tnode-caret{font-size:11px;}
  .tnode-dot{font-size:16px;line-height:1;color:#bfbfbf;}
  .tnode-ico{font-size:13px;flex:none;}
  .tnode-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tnode-acts{display:none;gap:8px;font-size:12px;flex:none;}
  .tnode:hover .tnode-acts{display:inline-flex;}
  .tnode-acts a{color:#1677ff;}
  .tnode-acts a.danger{color:#ff4d4f;}
  .ph-empty-sm{color:#8c8c8c;font-size:13px;padding:14px 10px;}
  .ph-form{max-width:560px;}
  .ph-sup-list{margin-bottom:8px;}
  .ph-sup{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;border:1px solid #f0f0f0;border-radius:6px;margin-bottom:8px;font-size:13px;}
  .ph-sup .danger{color:#ff4d4f;}
  .p3-wrap{display:flex;gap:12px;padding:12px;align-items:stretch;}
  .p3-col{display:flex;flex-direction:column;border:1px solid #f0f0f0;border-radius:8px;background:#fff;overflow:hidden;min-width:0;}
  .p3-col.planner{flex:0 0 210px;}
  .p3-col.group{flex:0 0 290px;}
  .p3-col.supp{flex:1;}
  .p3-head{padding:10px 12px;border-bottom:1px solid #f0f0f0;background:#fafafa;flex:none;}
  .p3-head-row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .p3-head-total{font-size:13px;color:#2f54eb;font-weight:600;white-space:nowrap;background:#e6f0ff;border:1px solid #bcd4ff;border-radius:6px;padding:3px 10px;}
  .p3-head-t{font-weight:600;font-size:13px;color:#1f1f1f;}
  .p3-head-s{font-size:12px;color:#8c8c8c;margin-top:3px;}
  .p3-body{flex:1;overflow:auto;max-height:54vh;padding:6px;}
  .p3-foot{padding:8px 10px;border-top:1px solid #f0f0f0;display:flex;gap:6px;flex-wrap:wrap;align-items:center;flex:none;}
  .p3-item{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:6px;cursor:pointer;font-size:13px;color:#1f1f1f;}
  .p3-item:hover{background:#f5f8ff;}
  .p3-item.active{background:#e6f4ff;}
  .p3-item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .p3-item .cnt{font-size:12px;color:#8c8c8c;flex:none;}
  .p3-item .cnt.part{color:#2f54eb;font-weight:600;}

  /* ---- 服务水平 Dashboard ---- */
  .svc-page-title{font-weight:600;font-size:15px;color:#1f1f1f;}
  .svc-grid{display:grid;gap:12px;margin-bottom:12px;}
  .svc-grid-3{grid-template-columns:1fr 1fr 1fr;}
  .svc-grid-final{grid-template-columns:2fr 1fr;}
  .svc-card{background:#fff;border:1px solid #f0f0f0;border-radius:8px;padding:12px 14px;min-width:0;}
  .svc-card-t{font-weight:600;font-size:13px;color:#1f1f1f;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
  /* 核心指标卡片：总-分（整体 + 3 渠道） × 日-月 */
  /* 核心指标 + 趋势：同一行紧凑布局 */
  .svc-top-card{display:flex;border:1px solid #f0f0f0;border-radius:8px;background:#fff;overflow:hidden;margin-bottom:12px;}
  .svc-top-left{flex:1 1 60%;min-width:0;padding:12px 14px;display:flex;flex-direction:column;justify-content:flex-start;gap:10px;}
  .svc-top-right{flex:1 1 40%;min-width:0;border-left:1px solid #f0f0f0;padding:10px 12px;display:flex;flex-direction:column;}
  .svc-top-h{font-weight:600;font-size:13px;color:#1f1f1f;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
  .svc-kpi-rows{display:flex;flex-direction:column;gap:10px;}
  .svc-kpi-grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .svc-kpi2{background:#fff;border:1px solid #f0f0f0;border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-width:0;}
  .svc-kpi2.overall{background:#f7f9ff;border-color:#e6edff;}
  .svc-kpi2-t{display:flex;align-items:center;justify-content:space-between;gap:6px;min-width:0;}
  .svc-kpi2-tag{font-weight:700;font-size:13px;color:#1f1f1f;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .svc-kpi2.overall .svc-kpi2-tag{color:#2f54eb;}
  .svc-kpi2-code{font-size:11px;color:#8c8c8c;background:#f5f5f5;border-radius:4px;padding:0 6px;font-weight:400;flex:none;}
  .svc-kpi2-main{display:flex;align-items:baseline;gap:10px;}
  .svc-kpi2-num{font-size:28px;font-weight:700;color:#1f1f1f;line-height:1;}
  .svc-kpi2-num i{font-style:normal;font-size:13px;margin-left:1px;color:#8c8c8c;}
  .svc-kpi2-dot{width:6px;height:6px;border-radius:50%;flex:none;display:inline-block;}
  .svc-kpi2-dot.ok{background:#52c41a;}
  .svc-kpi2-dot.bad{background:#fa8c16;}
  .svc-kpi2-foot{font-size:10px;color:#8c8c8c;border-top:1px dashed #eee;padding-top:6px;}
  .svc-kpi-status{font-weight:600;}
  .svc-kpi-status.ok{color:#52c41a;}
  .svc-kpi-status.bad{color:#fa8c16;}
  /* 排行排序切换 / 品牌子 tab */
  .svc-sort{display:inline-flex;border:1px solid #d9d9d9;border-radius:6px;overflow:hidden;font-size:11px;font-weight:400;flex:none;cursor:pointer;user-select:none;}
  .svc-sort i{padding:2px 9px;color:#8c8c8c;font-style:normal;transition:.15s;}
  .svc-sort i.on{background:#2f54eb;color:#fff;}
  .svc-tabs{display:flex;gap:6px;margin:2px 0 8px;flex-wrap:wrap;}
  .svc-tab{font-size:12px;padding:3px 12px;border:1px solid #d9d9d9;border-radius:14px;color:#595959;cursor:pointer;background:#fff;transition:.15s;}
  .svc-tab.on{background:#2f54eb;border-color:#2f54eb;color:#fff;font-weight:600;}
  /* ECharts 容器 */
  .svc-echart{width:100%;}
  .svc-pie-flex{display:flex;align-items:center;gap:8px;}
  .svc-pie-legend{display:flex;flex-direction:column;gap:9px;flex:1;min-width:0;padding:4px 2px;}
  .svc-pie-leg-row{display:flex;align-items:center;gap:8px;font-size:12px;}
  .svc-pie-dot{width:9px;height:9px;border-radius:50%;flex:none;}
  .svc-pie-leg-name{flex:1;color:#1f1f1f;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .svc-pie-leg-val{color:#595959;font-weight:600;}
  .p3-radio{width:12px;height:12px;border-radius:50%;border:1px solid #d9d9d9;flex:none;}
  .p3-radio.on{border-color:#1677ff;background:#1677ff;box-shadow:inset 0 0 0 2px #fff;}
  .p3-empty{color:#8c8c8c;font-size:13px;padding:18px 10px;text-align:center;}
  .p3-pool{display:flex;flex-direction:column;gap:6px;}
  .p3-selbar{font-size:12px;color:#8c8c8c;}
  .p3-import-result{margin-top:12px;padding:10px 12px;border:1px solid #f0f0f0;border-radius:6px;background:#fafcff;}
  .p3-imp-line{font-size:13px;color:#1f1f1f;line-height:1.8;}
  .p3-imp-err{margin-top:8px;padding-top:8px;border-top:1px dashed #e6e6e6;font-size:12px;color:#ff4d4f;line-height:1.7;}
  .mini-tag{display:inline-block;background:#f0f5ff;color:#2f54eb;border-radius:4px;padding:0 6px;font-size:11px;margin-left:6px;}
  /* ===== 需求预测 / 参考零件需求预测 ===== */
  .fc-new-card{padding:16px 18px;}
  .fc-new-body{display:flex;gap:22px;min-height:560px;}
  .fc-steps{flex:0 0 240px;border-right:1px solid #f0f0f0;padding-right:18px;}
  .fc-steps-t{font-weight:600;font-size:14px;color:#1f1f1f;margin-bottom:14px;}
  .fc-step{display:flex;gap:10px;position:relative;padding-bottom:20px;cursor:pointer;}
  .fc-step:last-child{padding-bottom:0;}
  .fc-step::before{content:'';position:absolute;left:13px;top:28px;bottom:2px;width:1px;background:#e6e6e6;}
  .fc-step:last-child::before{display:none;}
  .fc-step-no{flex:none;width:27px;height:27px;border-radius:50%;background:#1677ff;color:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;z-index:1;}
  .fc-step-no.auto{background:#95de64;color:#fff;}
  .fc-step-no.on{box-shadow:0 0 0 3px rgba(22,119,255,.18);}
  .fc-step-main{min-width:0;padding-top:2px;}
  .fc-step-title{font-size:13px;font-weight:600;color:#1f1f1f;line-height:1.5;}
  .fc-step.on .fc-step-title{color:#1677ff;}
  .fc-step-desc{font-size:12px;color:#8c8c8c;margin-top:2px;line-height:1.5;}
  .fc-auto{display:inline-block;margin-left:6px;background:#f6ffed;color:#52c41a;border:1px solid #b7eb8f;border-radius:4px;font-size:11px;font-weight:400;padding:0 5px;line-height:16px;vertical-align:1px;}
  .fc-panel{flex:1;min-width:0;}
  .fc-panel-h{font-size:15px;font-weight:600;color:#1f1f1f;margin-bottom:14px;}
  .fc-auto-card{padding:8px 2px;}
  .fc-auto-badge{display:inline-block;background:#f6ffed;color:#52c41a;border:1px solid #b7eb8f;border-radius:4px;font-size:12px;padding:1px 8px;}
  .fc-auto-name{font-size:16px;font-weight:600;color:#1f1f1f;margin-top:10px;}
  .fc-auto-desc{font-size:13px;color:#8c8c8c;margin-top:4px;}
  .link-btn.danger{color:#ff4d4f;}
  /* 常规预测：表格内缩略趋势图 */
  .fc-trend-hd{display:flex;flex-wrap:wrap;gap:18px;font-size:12px;color:#8c8c8c;margin-bottom:6px;}
  .fc-trend-hd b{color:#1f1f1f;font-weight:600;}
  .fc-trend-legend{display:flex;flex-wrap:wrap;gap:16px;font-size:12px;color:#595959;margin-bottom:6px;}
  .fc-trend-legend .ln{display:inline-block;width:22px;height:0;margin-right:6px;vertical-align:middle;}
  .fc-trend-legend .ln.hist{border-top:2px solid #1677ff;}
  .fc-trend-legend .ln.fct{border-top:2px dashed #fa8c16;}
  .fc-trend-legend .ln.split{border-top:2px dashed #8c8c8c;}
  .fc-trend-legend .ln.adj{border-top:2px solid #52c41a;}
  .fc-trend-legend .ln.buyout{border-top:2px solid #f5222d;}
  /* 需求预测 / 预测模拟（Backtest） */
  .bt-card{padding:16px 18px;}
  .bt-hd{border-bottom:1px solid #f0f0f0;padding-bottom:10px;margin-bottom:14px;}
  .bt-hd-t{font-size:15px;font-weight:600;color:#1f1f1f;}
  .bt-hd-d{font-size:12px;color:#8c8c8c;margin-top:6px;line-height:1.7;}
  .bt-crumb{margin-bottom:6px;}
  .bt-crumb-link{color:#1677ff;cursor:pointer;}
  .bt-query{border:1px solid #f0f0f0;border-radius:6px;padding:12px 14px 2px;background:#fafafa;margin-bottom:12px;}
  .bt-bar{margin-bottom:10px;}
  .bt-form-v .ant-form-item{margin-bottom:12px;}
  .bt-tip{font-size:12px;color:#8c8c8c;margin-left:10px;}
  .bt-foot{margin-top:16px;padding-top:12px;border-top:1px solid #f0f0f0;}
  .bt-ctx{display:flex;flex-wrap:wrap;align-items:center;gap:18px;font-size:12px;color:#8c8c8c;border:1px solid #f0f0f0;border-radius:6px;padding:10px 14px;margin-bottom:14px;background:#fafafa;}
  .bt-ctx b{color:#1f1f1f;font-weight:600;}
  .bt-sec{margin-bottom:18px;}
  .bt-sec-t{font-size:13px;font-weight:600;color:#1f1f1f;margin-bottom:10px;padding-left:8px;border-left:3px solid #1677ff;}
  .bt-sec-sub{font-weight:400;color:#8c8c8c;font-size:12px;margin-left:10px;}
  .bt-form .ant-form-item{margin-bottom:10px;}
  .bt-split{border:1px solid #f0f0f0;border-radius:6px;padding:12px 14px;margin:6px 0 12px;background:#fafafa;}
  .bt-split-lab{font-size:12px;color:#595959;font-weight:600;margin-bottom:8px;}
  /* ===== 统一弹窗风格（对齐「库存策略参数」：居中弹窗 + 双列表单网格 + 右对齐操作栏） ===== */
  .jlrs-modal-footer{display:flex;justify-content:flex-end;gap:10px;border-top:1px solid #edf0f5;margin-top:24px;padding-top:16px;}
  .jlrs-form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 24px;}
  .jlrs-form-grid>label{display:flex;flex-direction:column;gap:8px;color:#45536a;font-size:13px;}
  .jlrs-form-grid .ant-select,.jlrs-form-grid .ant-input-number,.jlrs-form-grid .ant-picker{width:100%;}
  .jlrs-form-grid-3{grid-template-columns:repeat(3,minmax(0,1fr));}
  .jlrs-req{color:#ff4d4f;margin-right:2px;}
  .jlrs-sec{font-size:13px;font-weight:600;color:#1f1f1f;margin:4px 0 12px;}
  .fc-bridge-total-row>td{background:#fafafa !important;font-weight:600;border-top:1px solid #d9d9d9;}
  .fc-bridge-cur-th{background:#e6f4ff !important;color:#1677ff !important;}
  .bt-split-bar{display:flex;height:26px;border-radius:4px;overflow:hidden;border:1px solid #e6e6e6;}
  .bt-seg{font-size:12px;color:#fff;display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;}
  .bt-seg.train{background:#1677ff;} .bt-seg.valid{background:#fa8c16;} .bt-seg.test{background:#8c8c8c;}
  .bt-split-in{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:12px;color:#595959;flex-wrap:wrap;}
  .bt-sum{margin-left:8px;color:#52c41a;} .bt-sum.err{color:#ff4d4f;}
  .bt-note{font-size:12px;color:#8c8c8c;margin-left:8px;}
  .bt-len-auto{display:inline-block;min-width:44px;padding:0 8px;height:24px;line-height:22px;text-align:center;
    border:1px solid #d9d9d9;border-radius:4px;background:#fafafa;color:#1677ff;font-weight:600;font-size:13px;}
  .bt-range-auto{margin-top:6px;font-size:12px;color:#595959;}
  .bt-range-hint{margin-top:6px;font-size:12px;color:#d46b08;background:#fff7e6;border:1px solid #ffd591;
    border-radius:4px;padding:6px 10px;line-height:1.6;}
  .bt-lab{font-size:12px;color:#595959;margin-right:6px;}
  .bt-kpis{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px;}
  .bt-kpi{flex:1;min-width:170px;border:1px solid #f0f0f0;border-radius:6px;padding:12px 14px;background:#fff;}
  .bt-kpi-t{font-size:12px;color:#8c8c8c;}
  .bt-kpi-v{font-size:22px;font-weight:600;margin-top:4px;line-height:1.2;}
  .bt-kpi-v .u{font-size:12px;font-weight:400;margin-left:3px;color:#8c8c8c;}
  .bt-kpi-d{font-size:12px;color:#8c8c8c;margin-top:4px;line-height:1.6;}
  .bt-guide{font-size:12px;color:#595959;background:#f6ffed;border:1px solid #b7eb8f;border-radius:4px;padding:8px 12px;line-height:1.7;}
  .bt-mini{font-size:12px;color:#595959;}
  .gp-coef-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px 16px;}
  .gp-coef-item{display:flex;flex-direction:column;gap:4px;}
  .gp-coef-lab{font-size:12px;color:#595959;}
  .bt-drill-hd{display:flex;flex-wrap:wrap;gap:18px;font-size:12px;color:#8c8c8c;margin-bottom:6px;}
  .bt-drill-hd b{color:#1f1f1f;font-weight:600;}
  .bt-drill-legend{display:flex;flex-wrap:wrap;gap:16px;font-size:12px;color:#595959;margin-bottom:6px;}
  .bt-drill-legend .ln{display:inline-block;width:22px;height:0;margin-right:6px;vertical-align:middle;}
  .bt-drill-legend .ln.a{border-top:2px solid #1677ff;}
  .bt-drill-legend .ln.f{border-top:2px dashed #fa8c16;}
  .bt-drill-legend .ln.d{border-top:2px solid #52c41a;}
  .bt-drill-legend .ln.s{border-top:8px solid rgba(250,140,22,.14);}
  .bt-drill-cause{margin-top:12px;border-top:1px dashed #e6e6e6;padding-top:10px;}
  .bt-drill-cause-t{font-size:13px;font-weight:600;color:#1f1f1f;margin-bottom:6px;}
  .bt-drill-cause-d{font-size:12px;color:#595959;line-height:1.8;}
</style>

<body>
<script type="text/x-template" id="app-tpl">
<div class="app-container">
  <a-config-provider :locale="zhCN">
  <div class="layout-root">

    <!-- ================= 顶部栏 ================= -->
    <div class="top-bar">
      <div class="top-tabs">
        <div class="top-tab" v-for="t in topTabs" :key="t.key" :class="{active:activeMenu===t.key}" @click="clickTopTab(t)">
          <span v-html="t.icon"></span>{{ t.title }}<span v-if="t.closable" class="tab-x">✕</span>
        </div>
      </div>
      <div class="top-right">
        <span class="item" @click="msg('暂无新消息')">🔔 消息</span>
        <span class="item" @click="msg('语言切换（设计稿示意）')">🇨🇳 简体中文 <span style="font-size:10px;">▾</span></span>
        <span class="item"><span class="avatar">超</span>超级管理员 <span style="font-size:10px;">▾</span></span>
      </div>
    </div>

    <div class="body-wrap">
      <!-- ================= 左侧菜单 ================= -->
      <div class="side-menu" :class="{collapsed:collapsed}">
        <div class="logo-row" v-if="!collapsed" @click="switchMenu('wh-abc')">
          <span class="logo-jlrs">CSPP <span class="caret">▼</span></span>
        </div>
        <div class="logo-row" v-else style="font-weight:800;">J</div>
        <div class="menu-search" v-if="!collapsed">
          <a-input v-model:value="menuKeyword" placeholder="搜索菜单" size="small" allow-clear>
            <template #suffix><span style="color:#bbb;">⌕</span></template>
          </a-input>
        </div>
        <div class="menu-scroll">
          <template v-for="m in filteredMenus" :key="m.key">
            <div v-if="m.type==='group'" class="menu-group" @click="openGroups[m.key]=!openGroups[m.key]">
              <span>▦</span><span v-if="!collapsed">{{ m.title }}</span>
              <span v-if="!collapsed" class="g-caret" :class="{open:openGroups[m.key]}">▼</span>
            </div>
            <div v-else class="menu-item" :class="{active:activeMenu===m.key}"
                 v-show="!m.parent || openGroups[m.parent]"
                 @click="switchMenu(m.key)">
              <span class="ico">{{ m.icon }}</span>
              <span v-if="!collapsed">{{ m.title }}</span>
              <span v-if="!collapsed && m.arrow" class="arrow">▸</span>
            </div>
          </template>
        </div>
        <div class="menu-foot" @click="collapsed=!collapsed">
          <span>{{ collapsed ? '»' : '⇤' }}</span><span v-if="!collapsed">点击收起菜单</span>
        </div>
      </div>

      <!-- ================= 主区域 ================= -->
      <div class="main-area">
        <div class="crumb-bar">
          <a-breadcrumb separator="/">
            <a-breadcrumb-item><a style="cursor:pointer" @click="switchMenu('wh-abc')">首页</a></a-breadcrumb-item>
            <a-breadcrumb-item v-if="parentGroupTitle">{{ parentGroupTitle }}</a-breadcrumb-item>
            <a-breadcrumb-item><span class="cur">{{ activeTitle }}</span></a-breadcrumb-item>
            <a-breadcrumb-item v-if="activeMenu==='gp-params' && gpView==='edit'"><span class="cur">编辑</span></a-breadcrumb-item>
          </a-breadcrumb>
        </div>
        <div class="page-scroll">

          <!-- ============ 配件分仓级数据（仓库×ABC分类 核心页） ============ -->
          <template v-if="activeMenu==='wh-abc'">

            <!-- 筛选卡片 -->
            <div class="card">
              <div class="filter-row">
                <div class="filter-items">
                  <div class="f-item"><span class="f-label">仓库编码</span>
                    <a-select v-model:value="filters.wh" placeholder="请选择仓库" style="width:180px" allow-clear show-search
                      option-filter-prop="label" :options="whOptions"/></div>
                  <div class="f-item"><span class="f-label">仓库名称</span><a-input v-model:value="filters.whName" placeholder="请输入仓库名称" style="width:170px" allow-clear/></div>
                  <div class="f-item"><span class="f-label">配件号</span>
                    <a-input v-model:value="filters.code" placeholder="配件号" style="width:170px" allow-clear/></div>
                  <div class="f-item"><span class="f-label">配件名称</span>
                    <a-input v-model:value="filters.name" placeholder="配件名称" style="width:170px" allow-clear/></div>
                  <template v-if="filterExpanded">
                    <div class="f-item"><span class="f-label">备货标识</span>
                      <a-select v-model:value="filters.stock" placeholder="请选择" style="width:130px" allow-clear
                        :options="[{value:'允许',label:'允许'},{value:'禁止',label:'禁止'}]"/></div>

                  </template>
                </div>
                <div class="filter-actions">
                  <a-button type="primary" @click="doSearch">搜索</a-button>
                  <span class="act" :style="{color:fav?'#faad14':''}" @click="toggleFav">{{ fav ? '★' : '☆' }}</span>
                  <span class="act" @click="msg('分享链接已复制（设计稿示意）')">⤴</span>
                  <span class="act" @click="filterExpanded=!filterExpanded">
                    <span class="txt">{{ filterExpanded ? '收起' : '展开' }}</span><span style="font-size:10px;">▾</span>
                  </span>
                </div>
              </div>
            </div>

            <!-- 表格卡片 -->
            <div class="card" style="margin-bottom:0;">
              <div class="toolbar-row">
                <a-button type="primary" @click="openBlkCreate">新增</a-button>
                <a-button type="primary" @click="exportCsv(false)">⬇ 导出</a-button>
                <a-button type="link" style="padding:0;" @click="exportCsv(true)">全量导出</a-button>
                <a-button type="default" @click="whImportOpen=true">⬆ 导入</a-button>
                <div class="toolbar-icons">
                  <a-dropdown>
                    <span title="密度" @click.stop="() => {}">↕</span>
                    <template #overlay>
                      <a-menu @click="({key})=>tableSize=key">
                        <a-menu-item key="large">默认</a-menu-item>
                        <a-menu-item key="middle">中等</a-menu-item>
                        <a-menu-item key="small">紧凑</a-menu-item>
                      </a-menu>
                    </template>
                  </a-dropdown>
                  <a-dropdown :trigger="['click']">
                    <span title="列设置" @click.stop="() => {}">⚙</span>
                    <template #overlay>
                      <a-card style="width:170px;" :body-style="{padding:'8px 12px'}">
                        <div style="font-weight:600;margin-bottom:6px;">列展示设置</div>
                        <div class="col-set-item" v-for="c in (activeMenu==='dealer'?dealerColumns:allColumns)" :key="c.key">
                          <a-checkbox :checked="!(activeMenu==='dealer'?dealerHiddenCols:hiddenCols).includes(c.key)" @change="toggleCol(c.key)"/>{{ c.title }}
                        </div>
                      </a-card>
                    </template>
                  </a-dropdown>
                  <span title="全屏" @click="toggleFull">⛶</span>
                </div>
              </div>

              <!-- 已选提示栏（电商订单式批量操作） -->
              <div class="sel-bar">
                <span class="sel-txt">
                  已选 <b>{{ selectedCount }}</b> 项
                  <a style="margin-left:10px;" @click="clearSelection">清空</a>
                  <a v-if="selectedCount < filteredRecords.length" style="margin-left:10px;" @click="selectAllFiltered">全选全部 {{ filteredRecords.length }} 条</a>
                </span>
                <span class="sel-actions">
                  <a-button size="small" :disabled="!selectedCount" @click="openBlkBatch">批量设置备货规则</a-button>
                </span>
              </div>

              <a-table
                :columns="visibleColumns"
                :data-source="pagedRecords"
                :pagination="false"
                :size="tableSize"
                row-key="id"
                :scroll="{x:1150}"
                :custom-row="customRow"
                :row-selection="{ selectedRowKeys: selectedKeys, onChange: onSelectChange, columnWidth:48 }"
              >
                <template #bodyCell="{ column, record }">
                  <template v-if="column.key==='code'">
                    <a @click.stop="openDetail(record)">{{ record.code }}</a>
                  </template>
                  <template v-if="column.key==='abc'">
                    <a-tooltip :title="abcTip(record)">
                      <span class="col-chip" :style="{background:classColor[record.abc]}">{{ record.abc }}</span>
                    </a-tooltip>
                  </template>
                  <template v-if="column.key==='xyz'">
                    <a-tag :color="xyzColor[record.xyz]" style="margin:0;">{{ record.xyz }}</a-tag>
                  </template>
                  <template v-if="column.key==='remark'">{{record.remark || '—'}}</template>
                  <template v-if="column.key==='stock'">
                    <a-tag :color="record.stock_flag==='允许'?'green':'red'" style="margin:0;">{{ record.stock_flag }}</a-tag>
                  </template>
                  <template v-if="column.key==='wh'">
                    {{ record.whName }}<span class="mini-tag">{{ record.whCode }}</span>
                  </template>
                  <template v-if="column.key==='whType'">
                    <a-tag :color="whTypeColor(record.whType)" style="margin:0;">{{ whTypeText(record.whType) }}</a-tag>
                  </template>
                  <template v-if="column.key==='action'">
                    <span class="link-btn" @click.stop="openDetail(record)">详情</span>
                    <span class="link-btn" @click.stop="openBlkEdit(record)">编辑</span>
                  </template>
                </template>
                <template #emptyText><a-empty description="暂无数据"/></template>
              </a-table>

              <div class="pager-row">
                <span class="total">共 {{ filteredRecords.length }} 条</span>
                <a-pagination
                  v-model:current="page.current"
                  v-model:pageSize="page.size"
                  :total="filteredRecords.length"
                  :page-size-options="['10','15','30','50']"
                  show-size-changer
                  :show-quick-jumper="false"
                />
              </div>
            </div>
          </template>

          <!-- ============ 经销商主数据（ods_dealer） ============ -->
          <template v-else-if="activeMenu==='dealer'">

            <!-- 筛选卡片 -->
            <div class="card">
              <div class="filter-row">
                <div class="filter-items">
                  <div class="f-item"><span class="f-label">经销商代码</span>
                    <a-input v-model:value="dealerFilters.code" placeholder="经销商代码" style="width:180px" allow-clear/></div>
                  <div class="f-item"><span class="f-label">经销商名称</span>
                    <a-input v-model:value="dealerFilters.name" placeholder="经销商名称" style="width:200px" allow-clear/></div>
                  <div class="f-item"><span class="f-label">国家</span>
                    <a-input v-model:value="dealerFilters.country" placeholder="国家" style="width:120px" allow-clear/></div>
                  <div class="f-item"><span class="f-label">省</span>
                    <a-input v-model:value="dealerFilters.province" placeholder="省" style="width:130px" allow-clear/></div>
                  <div class="f-item"><span class="f-label">市</span>
                    <a-input v-model:value="dealerFilters.city" placeholder="市" style="width:120px" allow-clear/></div>
                  <template v-if="dealerFilterExpanded">
                    <div class="f-item"><span class="f-label">全局订单冻结</span>
                      <a-select v-model:value="dealerFilters.orderBlock" placeholder="订单冻结" style="width:120px" allow-clear
                        :options="[{value:'X',label:'已冻结'},{value:'N',label:'未冻结'}]"/></div>
                    <div class="f-item"><span class="f-label">全局开票冻结</span>
                      <a-select v-model:value="dealerFilters.billBlock" placeholder="开票冻结" style="width:120px" allow-clear
                        :options="[{value:'X',label:'已冻结'},{value:'N',label:'未冻结'}]"/></div>
                    <div class="f-item"><span class="f-label">全局交货冻结</span>
                      <a-select v-model:value="dealerFilters.deliBlock" placeholder="交货冻结" style="width:120px" allow-clear
                        :options="[{value:'X',label:'已冻结'},{value:'N',label:'未冻结'}]"/></div>
                  </template>
                </div>
                <div class="filter-actions">
                  <a-button type="primary" @click="dealerDoSearch">搜索</a-button>
                  <span class="act" :style="{color:dealerFav?'#faad14':''}" @click="dealerToggleFav">{{ dealerFav ? '★' : '☆' }}</span>
                  <span class="act" @click="msg('分享链接已复制（设计稿示意）')">⤴</span>
                  <span class="act" @click="dealerFilterExpanded=!dealerFilterExpanded">
                    <span class="txt">{{ dealerFilterExpanded ? '收起' : '展开' }}</span><span style="font-size:10px;">▾</span>
                  </span>
                </div>
              </div>
            </div>

            <!-- 表格卡片 -->
            <div class="card" style="margin-bottom:0;">
              <div class="toolbar-row">
                <a-button type="primary" @click="dealerExportCsv(false)">⬇ 导出</a-button>
                <a-button type="link" style="padding:0;" @click="dealerExportCsv(true)">全量导出</a-button>
                <div class="toolbar-icons">
                  <a-dropdown>
                    <span title="密度" @click.stop="() => {}">↕</span>
                    <template #overlay>
                      <a-menu @click="({key})=>tableSize=key">
                        <a-menu-item key="large">默认</a-menu-item>
                        <a-menu-item key="middle">中等</a-menu-item>
                        <a-menu-item key="small">紧凑</a-menu-item>
                      </a-menu>
                    </template>
                  </a-dropdown>
                  <a-dropdown :trigger="['click']">
                    <span title="列设置" @click.stop="() => {}">⚙</span>
                    <template #overlay>
                      <a-card style="width:180px;" :body-style="{padding:'8px 12px'}">
                        <div style="font-weight:600;margin-bottom:6px;">列展示设置</div>
                        <div class="col-set-item" v-for="c in dealerColumns" :key="c.key">
                          <a-checkbox :checked="!dealerHiddenCols.includes(c.key)" @change="toggleCol(c.key)"/>{{ c.title }}
                        </div>
                      </a-card>
                    </template>
                  </a-dropdown>
                  <span title="全屏" @click="toggleFull">⛶</span>
                </div>
              </div>

              <a-table
                :columns="dealerVisibleColumns"
                :data-source="dealerPaged"
                :pagination="false"
                :size="tableSize"
                row-key="id"
                :scroll="{x:1500}"
                :custom-row="dealerCustomRow"
              >
                <template #bodyCell="{ column, record }">
                  <template v-if="column.key==='asc_code'">
                    <a @click.stop="openDealerDetail(record)">{{ record.asc_code }}</a>
                  </template>
                  <template v-if="column.key==='status'">
                    <a-tag :color="record._statusColor" style="margin:0;">{{ record._statusText }}</a-tag>
                  </template>
                  <template v-if="column.key==='central_order_block'">
                    <a-tag :color="record.central_order_block==='X'?'red':'green'" style="margin:0;">{{ record.central_order_block==='X'?'已冻结':'正常' }}</a-tag>
                  </template>
                  <template v-if="column.key==='central_billing_block'">
                    <a-tag :color="record.central_billing_block==='X'?'red':'green'" style="margin:0;">{{ record.central_billing_block==='X'?'已冻结':'正常' }}</a-tag>
                  </template>
                  <template v-if="column.key==='central_delivery_block'">
                    <a-tag :color="record.central_delivery_block==='X'?'red':'green'" style="margin:0;">{{ record.central_delivery_block==='X'?'已冻结':'正常' }}</a-tag>
                  </template>
                  <template v-if="column.key==='action'">
                    <span class="link-btn" @click.stop="openDealerDetail(record)">详情</span>
                    <span class="link-btn" @click.stop="openDealerEdit(record)">编辑</span>
                  </template>
                </template>
                <template #emptyText><a-empty description="暂无数据"/></template>
              </a-table>

              <div class="pager-row">
                <span class="total">共 {{ dealerFiltered.length }} 条</span>
                <a-pagination
                  v-model:current="dealerPage.current"
                  v-model:pageSize="dealerPage.size"
                  :total="dealerFiltered.length"
                  :page-size-options="['10','15','30','50']"
                  show-size-changer
                  :show-quick-jumper="false"
                />
              </div>
            </div>
          </template>

          <!-- ============ DMS 经销商主数据（ods_dms_dealer） ============ -->
          <template v-else-if="activeMenu==='dms-dealer'">

            <a-alert type="info" show-icon style="margin-bottom:12px;"
              message="数据来源：DMS 经销商公司主数据 / 经销商集团主数据同步接口（每日增量同步，主键 dealerId）；「Dealer类别」及之后为手工维护字段，全表字段均支持手工维护，纯手工新增由系统分配 dealerId（不与接口数据重复）。"/>

            <!-- 筛选卡片 -->
            <div class="card">
              <div class="filter-row">
                <div class="filter-items">
                  <div class="f-item"><span class="f-label">经销商代码</span>
                    <a-input v-model:value="dmsFilters.code" placeholder="经销商代码" style="width:170px" allow-clear/></div>
                  <div class="f-item"><span class="f-label">经销商名称</span>
                    <a-input v-model:value="dmsFilters.name" placeholder="经销商名称" style="width:200px" allow-clear/></div>
                  <div class="f-item"><span class="f-label">状态</span>
                    <a-select v-model:value="dmsFilters.status" placeholder="状态" style="width:120px" allow-clear
                      :options="[{value:1,label:'启用'},{value:0,label:'停用'},{value:2,label:'冻结'}]"/></div>
                  <div class="f-item"><span class="f-label">经销商类型</span>

                <span class="total">共 {{ poPlanRows.length }} 条</span>

                  v-model:current="poPlanPageCur.current"
                  v-model:pageSize="poPlanPageCur.size"
                  :total="poPlanRows.length"
                  :page-size-options="['15','30','50']"
                  show-size-changer
                  :show-quick-jumper="true"
                />
              </div>
            </div>

            <!-- 调整弹窗 -->
            <a-modal v-model:open="poPlanEditOpen" :title="'调整 · ' + poPlanPage.title" :width="640" :footer="null" :mask-closable="false">

                <a-alert v-if="poPlanEditErr" type="error" :message="poPlanEditErr" show-icon style="margin-bottom:12px;"/>
                <a-descriptions bordered :column="2" size="small" style="margin-bottom:16px;">
                  <a-descriptions-item label="配件号">{{ poPlanEditRow.part_code }}</a-descriptions-item>
                  <a-descriptions-item label="配件名称">{{ poPlanEditRow.part_name }}</a-descriptions-item>
                  <a-descriptions-item label="需求口径">{{ poPlanPage.title==='All Time Buy 计划' ? '全生命周期累计需求' : (poPlanPage.title==='Bridge Buy 计划' ? '区间预测需求' : '参考件预测需求量') }}</a-descriptions-item>
                  <a-descriptions-item label="需求数量">{{ poPlanPage.title==='All Time Buy 计划' ? poPlanEditRow.life_demand : (poPlanPage.title==='Bridge Buy 计划' ? poPlanEditRow.forecast_qty : poPlanEditRow.forecast_qty) }}</a-descriptions-item>
                  <a-descriptions-item label="预期库存">{{ poPlanEditRow.expected_stock }}</a-descriptions-item>
                  <a-descriptions-item label="净需求">{{ poPlanEditRow.net_demand }}</a-descriptions-item>
                  <a-descriptions-item label="MOQ / MPQ">{{ poPlanEditRow.moq + ' / ' + poPlanEditRow.mpq }}</a-descriptions-item>
                  <a-descriptions-item label="采购计划数量">{{ poPlanEditRow.plan_qty }}</a-descriptions-item>
                </a-descriptions>
                <div class="jlrs-form-grid">
                  <label><span><span class="jlrs-req">*</span>调整计划数量</span>
                    <a-input-number v-model:value="poPlanEditRow.adjust_qty" :min="0" :precision="0" style="width:100%" placeholder="非负整数"/></label>
                  <label><span>调整原因</span>
                    <a-input v-model:value="poPlanEditRow.adjust_reason" :maxlength="100" allow-clear
                      placeholder="调整数量与采购计划数量不一致时必填"/></label>
                </div>
                <div class="jlrs-modal-footer">
                  <a-button @click="poPlanEditOpen=false">取消</a-button>
                  <a-button type="primary" @click="poPlanSaveEdit">保存</a-button>
                </div>
              </template>
            </a-modal>

            <!-- 详情弹窗（只读） -->
            <a-modal v-model:open="poPlanDetailOpen" :title="'详情 · ' + poPlanPage.title" :width="920" :footer="null" :mask-closable="false">
              <template v-if="poPlanDetailRow">
                <div v-if="poPlanPage.trend" style="margin-bottom:14px;display:flex;align-items:center;gap:10px;">
                  <a @click.stop="openTrendModal(poPlanDetailRow)" style="color:#1677ff;cursor:pointer;font-weight:600;">📈 查看历史销量与预期趋势图</a>
                  <span style="color:#8c8c8c;font-size:12px;">（供审批前再评估需求合理性）</span>
                </div>
                <a-descriptions bordered :column="2" size="small">
                  <a-descriptions-item v-for="c in poPlanPage.columns.filter(x=>x.key!=='action')" :key="c.key" :label="c.title">

                  </a-descriptions-item>
                </a-descriptions>
                <div class="jlrs-modal-footer">
                  <a-button @click="poPlanDetailOpen=false">关闭</a-button>
                </div>
              </template>
            </a-modal>

            <!-- 审批通过 / 驳回 -->
            <a-modal v-model:open="poPlanApproveOpen" :title="'审批通过 · ' + poPlanPage.title" :width="560" :footer="null" :mask-closable="false">

              <label style="display:flex;flex-direction:column;gap:8px;">
                <span><span class="jlrs-req">*</span>审批意见</span>
                <a-textarea v-model:value="poPlanApproveRemark" :rows="3" placeholder="请输入审批意见，100 字以内" :maxlength="100"/>
              </label>
              <div class="jlrs-modal-footer">
                <a-button @click="poPlanApproveOpen=false">取消</a-button>
                <a-button type="primary" @click="poPlanApproveConfirm">确认通过</a-button>
              </div>
            </a-modal>
            <a-modal v-model:open="poPlanRejectOpen" :title="'驳回 · ' + poPlanPage.title" :width="560" :footer="null" :mask-closable="false">
              <a-alert v-if="poPlanRejectErr" type="error" :message="poPlanRejectErr" show-icon style="margin-bottom:16px;"/>
              <label style="display:flex;flex-direction:column;gap:8px;">
                <span><span class="jlrs-req">*</span>驳回意见</span>
                <a-textarea v-model:value="poPlanRejectRemark" :rows="3" placeholder="请输入驳回意见，100 字以内" :maxlength="100"/>
              </label>
              <div class="jlrs-modal-footer">
                <a-button @click="poPlanRejectOpen=false">取消</a-button>
                <a-button danger type="primary" @click="poPlanRejectConfirm">确认驳回</a-button>
              </div>

            <!-- 批量下计划（仅 All Time Buy 计划）：从一次买断预测结果勾选配件生成计划 -->

              <a-alert type="info" :show-icon="true" style="margin-bottom:12px;">
                <template #message>从一次买断预测结果中选择配件，系统按「十年累计需求 − 全国预期库存 → MPQ/MOQ 取整」生成 All Time Buy 计划（待提交）。</template>
              </a-alert>
              <a-table :columns="poAtbBatchCols" :data-source="poAtbBatchRows" row-key="id" size="small" bordered
                :row-selection="poAtbBatchRowSelection" :pagination="{pageSize:8}" :scroll="{x:900}"/>
              <div class="jlrs-modal-footer">
                <a-button @click="poAtbBatchOpen=false">取消</a-button>
                <a-button type="primary" :disabled="!poAtbBatchSel.length" @click="poAtbBatchGen">生成计划（{{ poAtbBatchSel.length }}）</a-button>
              </div>
            </a-modal>

            <!-- 采购计划页：预测趋势图弹窗（历史实际销量 + 预测销量；Bridge 高亮买断区间） -->
            <a-modal v-model:open="trendModal.open" :width="1020" :footer="null" destroy-on-close @after-close="closeTrendModal">
              <template #title>
                预测趋势 · {{ trendModal.row ? trendModal.row.part_code + ' ' + trendModal.row.part_name : '' }}
              </template>
              <div v-if="trendModal.row" class="fc-trend-hd">
                <span>配件号：<b>{{ trendModal.row.part_code }}</b></span>
                <span>配件名称：<b>{{ trendModal.row.part_name }}</b></span>
                <span v-if="trendModal.row.planner">计划员：<b>{{ trendModal.row.planner }}</b></span>
                <span v-if="trendModal.row.wh_code">仓库：<b>{{ trendModal.row.wh_code }} {{ trendModal.row.wh_name }}</b></span>
                <span v-if="trendModal.row.data_date">数据日期：<b>{{ trendModal.row.data_date }}</b></span>
              </div>
              <div v-if="trendModal.row" class="fc-trend-legend">
                <span><i class="ln hist"></i>{{ trendHistLabel }}</span>
                <span><i class="ln fct"></i>{{ trendFctLabel }}</span>
                <span v-if="trendAdjusted"><i class="ln adj"></i>人工调整预测结果（{{ trendAdjDesc }}）</span>
                <span><i class="ln split"></i>{{ trendModal.row.trendSplit }} 为历史 / 预测分界（虚线右侧为预测）</span>
                <span v-if="trendModal.row.trendBuyoutTo"><i class="ln buyout"></i>红色区间为买断覆盖年份</span>
              </div>
              <a-alert v-if="trendAdjusted" type="warning" show-icon banner style="margin-bottom:6px;"
                message="该配件预测值存在人工调整：绿线为调整后的预测结果，橙虚线为系统原始预测值，可对照查看各期调整幅度。"/>
              <div id="fcTrendChart" style="width:100%;height:390px;"></div>
            </a-modal>
          </template>

          <!-- ============ 5. 调拨计划（STO）：本周调拨计划（执行） / 下周调拨计划（预排） ============ -->
          <template v-else-if="activeMenu==='sto-week' || activeMenu==='sto-next'">

            <!-- 筛选卡片 -->
            <div class="card">
              <div class="filter-row">
                <div class="filter-items">
                  <div class="f-item"><span class="f-label">配件号</span>
                    <a-input v-model:value="stoFilters.part_code" placeholder="配件号" style="width:140px" allow-clear/></div>
                  <div class="f-item"><span class="f-label">配件名称</span>
                    <a-input v-model:value="stoFilters.part_name" placeholder="配件名称" style="width:160px" allow-clear/></div>
                  <div class="f-item"><span class="f-label">发货仓</span>
                    <a-select v-model:value="stoFilters.from_wh" placeholder="发货仓" style="width:150px" allow-clear
                      :options="stoFromWhs.map(v=>({value:v,label:v}))"/></div>
                  <div class="f-item"><span class="f-label">收货仓</span>
                    <a-select v-model:value="stoFilters.to_wh" placeholder="收货仓" style="width:150px" allow-clear
                      :options="stoToWhs.map(v=>({value:v,label:v}))"/></div>
                  <div class="f-item"><span class="f-label">仓网</span>
                    <a-select v-model:value="stoFilters.network_id" placeholder="仓网" style="width:110px" allow-clear
                      :options="stoNetworks.map(v=>({value:v,label:v}))"/></div>
                  <div class="f-item"><span class="f-label">计划类型</span>
                    <a-select v-model:value="stoFilters.plan_type" placeholder="计划类型" style="width:130px" allow-clear
                      :options="stoPlanTypeOptions.map(v=>({value:v,label:v}))"/></div>
                  <div class="f-item"><span class="f-label">计划批次</span>
                    <a-input v-model:value="stoFilters.plan_batch" placeholder="计划批次" style="width:130px" allow-clear/></div>
                  <div class="f-item"><span class="f-label">ABC分类</span>
                    <a-select v-model:value="stoFilters.abc_class" placeholder="ABC分类" style="width:110px" allow-clear
                      :options="[{value:'A',label:'A'},{value:'B',label:'B'},{value:'C',label:'C'}]"/></div>
                  <template v-if="stoFilterExpanded">
                    <div class="f-item"><span class="f-label">计划员</span>
                      <a-select v-model:value="stoFilters.planner" placeholder="计划员" style="width:110px" allow-clear
                        :options="fcPlanners.map(v=>({value:v,label:v}))"/></div>
                    <div class="f-item"><span class="f-label">运输线路</span>
                      <a-select v-model:value="stoFilters.route_code" placeholder="运输线路" style="width:140px" allow-clear
                        :options="stoRouteCodes.map(v=>({value:v,label:v}))"/></div>
                  </template>
                </div>
                <div class="filter-actions">
                  <a-button type="primary" @click="stoDoSearch">搜索</a-button>
                  <a-button @click="stoResetFilters">重置</a-button>
                  <span class="act" :style="{color:stoFav?'#faad14':''}" @click="stoToggleFav">{{ stoFav ? '★' : '☆' }}</span>
                  <span class="act" @click="msg('分享链接已复制（设计稿示意）')">⤴</span>
                  <span class="act" @click="stoFilterExpanded=!stoFilterExpanded">
                    <span class="txt">{{ stoFilterExpanded ? '收起' : '展开' }}</span><span style="font-size:10px;">▾</span>
                  </span>
                </div>
              </div>
            </div>

            <!-- 表格卡片 -->
            <div class="card" style="margin-bottom:0;">
              <div class="toolbar-row">
                <a-button type="primary" @click="stoExportOpen=true">导出</a-button>
                <div class="toolbar-icons">
                  <a-dropdown>
                    <span title="密度" @click.stop="() => {}">↕</span>
                    <template #overlay>
                      <a-menu @click="({key})=>tableSize=key">
                        <a-menu-item key="large">默认</a-menu-item>
                        <a-menu-item key="middle">中等</a-menu-item>
                        <a-menu-item key="small">紧凑</a-menu-item>
                      </a-menu>
                    </template>
                  </a-dropdown>
                  <a-dropdown :trigger="['click']">
                    <span title="列设置" @click.stop="() => {}">⚙</span>

                      <a-card style="width:220px;max-height:460px;overflow:auto;" :body-style="{padding:'8px 12px'}">

                        </div>
                      </a-card>
                    </template>
                  </a-dropdown>
                  <span title="全屏" @click="toggleFull">⛶</span>
                </div>

                  <template v-if="column.key==='part_code'">
                    <a @click.stop="stoOpenDetail(record)">{{ record.part_code }}</a>
                  </template>
                  <template v-else-if="column.key==='plan_type'">
                    <a-tag :color="record.plan_type==='紧急调拨计划'?'orange':'blue'" style="margin:0;">{{ record.plan_type }}</a-tag>
                  </template>
                  <template v-else-if="column.key==='action'">
                    <span class="link-btn" @click.stop="stoOpenDetail(record)">详情</span>
                  </template>
                  <template v-else>{{ record[column.dataIndex] }}</template>
                </template>
              </a-table>

              <div class="pager-row">
                <span class="total">共 {{ stoFiltered.length }} 条</span>
                <a-pagination
                  v-model:current="stoPage.current"
                  v-model:pageSize="stoPage.size"
                  :total="stoFiltered.length"
                  :page-size-options="['15','30','50']"
                  show-size-changer
                  :show-quick-jumper="true"
                />
              </div>
            </div>

            <!-- 详情弹窗：仅字段详情 + 备注编辑 -->

                  <a-descriptions-item label="配件号">{{ stoDetailRow.part_code }}</a-descriptions-item>

                  <a-descriptions-item label="收货仓">{{ stoDetailRow.to_wh }}</a-descriptions-item>

                  <a-descriptions-item label="收货仓目标库存">{{ stoDetailRow.target_stock }}</a-descriptions-item>
                  <a-descriptions-item label="是否出计划日">{{ stoDetailRow.is_plan_day }}</a-descriptions-item>
                  <a-descriptions-item label="ABC分类">{{ stoDetailRow.abc_class }}</a-descriptions-item>
                  <a-descriptions-item label="车型代码">{{ stoDetailRow.vehicle_code }}</a-descriptions-item>
                  <a-descriptions-item label="计划员">{{ stoDetailRow.planner }}</a-descriptions-item>
                  <a-descriptions-item label="预期库存">{{ stoDetailRow.expected_stock }}</a-descriptions-item>
                  <a-descriptions-item label="可用库存数量">{{ stoDetailRow.avail_qty }}</a-descriptions-item>
                  <a-descriptions-item label="欠交数量">{{ stoDetailRow.owed_qty }}</a-descriptions-item>
                  <a-descriptions-item label="库间在途数量">{{ stoDetailRow.transit_qty }}</a-descriptions-item>
                  <a-descriptions-item label="缺货数量">{{ stoDetailRow.shortage_qty }}</a-descriptions-item>
                  <a-descriptions-item label="近3个月月均销量">{{ stoDetailRow.avg3m_qty }}</a-descriptions-item>
                  <a-descriptions-item label="当前可用天数">{{ stoDetailRow.avail_days }}</a-descriptions-item>
                  <a-descriptions-item label="库间LT（天）">{{ stoDetailRow.transfer_lt }}</a-descriptions-item>
                  <a-descriptions-item label="要求到货日期">{{ stoDetailRow.required_arrival_date }}</a-descriptions-item>
                  <a-descriptions-item label="推荐计划数量（取整前）">{{ stoDetailRow.raw_qty }}</a-descriptions-item>
                  <a-descriptions-item label="推荐计划数量（分配后）">{{ stoDetailRow.alloc_qty }}</a-descriptions-item>
                  <a-descriptions-item label="体积">{{ stoDetailRow.unit_volume }}</a-descriptions-item>
                  <a-descriptions-item label="体积单位">{{ stoDetailRow.volume_unit }}</a-descriptions-item>
                  <a-descriptions-item label="预计调拨体积">{{ stoDetailRow.est_volume }}</a-descriptions-item>
                </a-descriptions>

                <a-textarea v-model:value="stoDetailRemark" :rows="3" :maxlength="200" show-count placeholder="请输入备注（选填）"/>

                <div class="jlrs-modal-footer">
                  <a-button @click="stoDetailOpen=false">关闭</a-button>
                  <a-button type="primary" @click="stoSaveRemark">保存备注</a-button>

                <a-button @click="stoExportOpen=false">取消</a-button>

                  <div class="f-item"><span class="f-label">计划批次</span>

                    </div>
                    <div id="fcRegMdlDl" style="width:100%;height:300px;"></div>
                  </div>
                  <div style="flex:1;min-width:0;border:1px solid #f0f0f0;border-radius:8px;padding:12px;">
                    <div style="font-weight:600;color:#fa8c16;margin-bottom:8px;">Trader 类型</div>
                    <div style="margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                      <span style="color:#595959;white-space:nowrap;">当前最佳模型：<b style="color:#fa8c16;">{{ fcRegMdl.rec.tr_model }}</b></span>
                    </div>
                    <div style="margin-bottom:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
                      <span style="color:#595959;">选择模型：</span>
                      <a-select v-model:value="fcRegMdl.trModel" style="width:230px"
                        :options="fcRegMdl.rec.trModels.map(m=>({value:m.name,label:m.name}))" @change="refreshRegMdlCharts"/>
                    </div>
                    <div id="fcRegMdlTr" style="width:100%;height:300px;"></div>
                  </div>
                </div>
                <div style="margin-top:12px;display:flex;align-items:center;gap:10px;">
                  <span style="color:#595959;white-space:nowrap;"><span style="color:#ff4d4f;">*</span> 有效期：</span>
                  <a-select v-model:value="fcRegMdl.validType" style="width:150px"
                    :options="[{value:'once',label:'单次生效'},{value:'until',label:'设定截止日期'}]"/>
                  <a-date-picker v-if="fcRegMdl.validType==='until'" v-model:value="fcRegMdl.validUntil" value-format="YYYY-MM-DD" placeholder="截止日期" style="width:150px"/>
                </div>
                <div style="margin-top:10px;display:flex;align-items:center;gap:10px;">
                  <span style="color:#595959;white-space:nowrap;"><span style="color:#ff4d4f;">*</span> 调整原因：</span>
                  <a-input v-model:value="fcRegMdl.reason" placeholder="应用预测结果时必填，请说明调整依据" style="flex:1"/>
                </div>
                <div style="margin-top:10px;display:flex;align-items:center;justify-content:flex-end;">
                  <a-button @click="fcRegMdl.open=false">取 消</a-button>
                  <a-button type="primary" style="margin-left:8px;" @click="fcApplyRegMdl">应用为预测结果</a-button>
                </div>
              </div>
            </a-modal>

            <!-- 长周期：批量调整 - 稀疏件圆整策略弹窗 -->

              <div style="margin-bottom:14px;color:#595959;font-size:13px;line-height:1.7;">
                本次调整范围共 <b style="color:#1677ff;">{{ fcLongBatchTargets.length }}</b> 个配件。<br/>
                <b>策略说明：</b>将 10 年预测按 <b>334</b> 拆分为 3 段（第 1-3 年 / 第 4-6 年 / 第 7-10 年），每段汇总后按年份依次轮询分布；调整后写入「调整原因」并设定「调整有效期」。
              </div>
              <a-form layout="vertical">
                <a-form-item label="调整范围">
                  <a-radio-group v-model:value="fcLongBatchM.source">
                    <a-radio value="selected">已勾选行（{{ fcBatchSelIds.length }}）</a-radio>
                    <a-radio value="codes">导入配件号</a-radio>
                  </a-radio-group>
                </a-form-item>
                <a-form-item v-if="fcLongBatchM.source==='codes'" label="导入配件号" required
                  :help="'支持直接粘贴或导入 txt / csv 文件：每行一个配件号，也可用逗号、分号分隔'">
                  <a-textarea v-model:value="fcLongBatchM.codesText" :rows="4" placeholder="例如：LR045678&#10;LR078901" />
                  <div style="margin-top:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                    <a-upload :before-upload="fcLongBatchFile" :show-upload-list="false" accept=".txt,.csv">
                      <a-button size="small">⬆ 导入文件</a-button>
                    </a-upload>
                    <span style="color:#8c8c8c;font-size:12px;">已匹配 <b>{{ fcLongBatchTargets.length }}</b> 条，未匹配 {{ fcLongBatchUnmatched.length }} 条</span>
                  </div>
                  <div v-if="fcLongBatchUnmatched.length" style="margin-top:4px;color:#cf1322;font-size:12px;">
                    未匹配配件号：{{ fcLongBatchUnmatched.slice(0,10).join('、') }}{{ fcLongBatchUnmatched.length > 10 ? ' 等 ' + fcLongBatchUnmatched.length + ' 个' : '' }}
                  </div>
                </a-form-item>
                <a-form-item label="策略名称" required>
                  <a-select v-model:value="fcLongBatchM.strategy" style="width:100%"
                    :options="[{ value:'sparse', label:'稀疏件圆整策略' }]"/>
                </a-form-item>
                <a-form-item label="调整有效期（月）" required
                  :help="'设置后，该期限内系统自动预测不再覆盖本次人工调整值'">
                  <a-input-number v-model:value="fcLongBatchM.validMonths" :min="1" :max="120" style="width:180px"/>
                </a-form-item>
              </a-form>
              <div style="text-align:right;margin-top:8px;">
                <a-button @click="fcLongBatchM.open=false">取 消</a-button>
                <a-button type="primary" style="margin-left:8px;" @click="fcLongBatchApply">确认批量调整</a-button>
              </div>
            </a-modal>

            <!-- 系数调整弹窗（仅长周期预测报表 / 一次买断预测结果） -->
            <a-modal v-model:open="lcCoefOpen" title="系数调整" :width="720" :footer="null">
              <div class="bt-sec-t" style="margin-bottom:14px;">长周期预测结果调整系数<span class="bt-sec-sub">按年份应用调整系数（第 1 ~ 10 年），输入为正数、支持小数</span></div>
              <div class="gp-coef-grid">
                <div class="gp-coef-item" v-for="n in 10" :key="n">
                  <span class="gp-coef-lab">第 {{ n }} 年</span>
                  <a-input-number v-model:value="lcCoeffs[n-1]" :min="0" :step="0.01" :precision="4" style="width:100%" placeholder="正数，可含小数"/>
                </div>
              </div>
                <div style="margin-top:18px;text-align:right;">
                <a-button @click="lcCoefOpen=false">取 消</a-button>
                <a-button type="primary" style="margin-left:8px;" @click="lcSaveCoeffs">保 存</a-button>
              </div>
            </a-modal>

            <!-- 生成 bridge buy 计划：勾选配件 → 选年份 → 配件 × 各年份需求宽表 → 生成计划 -->
            <a-modal v-model:open="fcBridgeOpen" title="生成 bridge buy 计划" :width="1200" :footer="null" :mask-closable="false">
              <template v-if="!fcBridgeDone">
                <a-alert type="info" :show-icon="true" style="margin-bottom:14px;">
                  <template #message>已选择 <b>{{ fcLongSel.length }}</b> 个配件（来自长周期预测报表勾选行）。请选择 bridge buy 年份，下方按配件维度展示该年份及以前各年的预测需求与合计。</template>
                </a-alert>
                <a-form layout="vertical">
                  <a-form-item label="bridge buy 年份" required>
                    <a-select v-model:value="fcBridgeYear" style="width:260px"
                      :options="fcLongFctYears.map(v=>({value:v,label:v+' 年（第 '+(fcLongFctYears.indexOf(v)+1)+' 年预测）'}))"/>
                  </a-form-item>
                </a-form>

                <div class="bt-sec-t" style="margin:6px 0 10px;">所选配件明细<span class="bt-sec-sub">仅展示所选年份及以前年份；末列与末行为区间合计，所选年份列头高亮</span></div>
                <a-table :columns="fcBridgeDetailCols" :data-source="fcBridgeDetailRows" row-key="id"
                  :pagination="false" size="small" bordered :row-class-name="fcBridgeDetailRowClass"
                  :scroll="{ x: fcBridgeScrollX }" :locale="{emptyText:'请先在长周期预测报表中勾选配件'}"/>

                <div class="jlrs-modal-footer">
                  <a-button @click="fcBridgeOpen=false">取 消</a-button>
                  <a-button type="primary" :disabled="!fcLongSel.length" @click="fcBridgeGenerate">生成bridge buy 计划</a-button>
                </div>
              </template>
              <template v-else>
                <a-alert type="success" :show-icon="true" style="margin-bottom:14px;">
                  <template #message>已生成 <b>{{ fcBridgeData.length }}</b> 条 bridge buy 计划（年份 {{ fcBridgeYear }}，合计数量 <b>{{ fcBridgeGenSum }}</b>）。</template>
                </a-alert>
                <a-table :columns="fcBridgeCols" :data-source="fcBridgeData" row-key="id"
                  :pagination="{pageSize:8}" size="small" bordered/>
                <div class="jlrs-modal-footer">
                  <a-button @click="fcBridgeDone=false">重新生成</a-button>
                  <a-button type="primary" @click="fcBridgeOpen=false">完 成</a-button>
                </div>
              </template>
            </a-modal>

            <!-- 生成 All Time Buy 计划：勾选配件 → 首年~末年全部需求 → 生成计划 -->
            <a-modal v-model:open="fcAllTimeOpen" title="生成 All Time Buy 计划" :width="1200" :footer="null" :mask-closable="false">
              <template v-if="!fcAllTimeDone">
                <a-alert type="info" :show-icon="true" style="margin-bottom:14px;">
                  <template #message>已选择 <b>{{ fcBatchSelIds.length }}</b> 个配件（来自一次买断预测结果勾选行）。All Time Buy 为一次性买断剩余生命周期（{{ fcLongFctYears[0] }}~{{ fcLongFctYears[fcLongFctYears.length-1] }}）的全部预测需求。</template>
                </a-alert>
                <div class="bt-sec-t" style="margin:6px 0 10px;">所选配件明细<span class="bt-sec-sub">各年预测需求按配件维度按列展示，末列为全周期合计</span></div>
                <a-table :columns="fcAllTimeCols" :data-source="fcAllTimeRows" row-key="id"
                  :pagination="false" size="small" bordered :row-class-name="fcAllTimeRowClass"
                  :scroll="{ x: 1250 }" :locale="{emptyText:'请先在一次买断预测结果中勾选配件'}"/>
                <div class="jlrs-modal-footer">
                  <a-button @click="fcAllTimeOpen=false">取 消</a-button>
                  <a-button type="primary" :disabled="!fcBatchSelIds.length" @click="fcAllTimeGenerate">生成 All Time Buy 计划</a-button>
                </div>
              </template>
              <template v-else>
                <a-alert type="success" :show-icon="true" style="margin-bottom:14px;">
                  <template #message>已生成 <b>{{ fcAllTimeData.length }}</b> 条 All Time Buy 计划（覆盖周期 {{ fcLongFctYears[0] }}~{{ fcLongFctYears[fcLongFctYears.length-1] }}，合计数量 <b>{{ fcAllTimeGenSum }}</b>）。</template>
                </a-alert>
                <a-table :columns="fcAllTimeResultCols" :data-source="fcAllTimeData" row-key="id"
                  :pagination="{pageSize:8}" size="small" bordered/>
                <div class="jlrs-modal-footer">
                  <a-button @click="fcAllTimeDone=false">重新生成</a-button>
                  <a-button type="primary" @click="fcAllTimeOpen=false">完 成</a-button>
                </div>
              </template>
            </a-modal>

            <!-- 新增/编辑 配件组（仅配件组管理）：联合 MOQ 类型需设阈值，成套采购组无额外参数 -->
            <a-modal v-model:open="pgModal.open" :title="(pgModal.mode==='add' ? '新增' : '修改') + ' · 配件组'" :width="920" :footer="null" :mask-closable="false">
              <a-form layout="vertical">
                <a-alert v-if="pgModal.err" type="error" :message="pgModal.err" show-icon style="margin-bottom:16px;"/>
                <div class="bt-sec-t" style="margin-bottom:12px;">基本信息<span class="bt-sec-sub">分组参数变更后自下一计算周期生效</span></div>
                <a-row :gutter="12">
                  <a-col :span="12"><a-form-item label="分组名称"><a-input v-model:value="pgModal.form.group_name" placeholder="如：前照灯左右件组"/></a-form-item></a-col>
                  <a-col :span="12"><a-form-item label="分组类型"><a-select v-model:value="pgModal.form.group_type" :options="pgTypeOptions.map(v=>({value:v,label:v}))"/></a-form-item></a-col>
                </a-row>

                <!-- 联合 MOQ：按组内合计凑单后分摊 -->
                <template v-if="pgModal.form.group_type==='联合MOQ'">
                  <div class="bt-sec-t" style="margin:6px 0 12px;">联合 MOQ 参数<span class="bt-sec-sub">组内合计达到阈值即可下单；与单品 MOQ 并存时以联合 MOQ 为准</span></div>
                  <a-row :gutter="12">
                    <a-col :span="6"><a-form-item label="联合 MOQ 阈值"><a-input-number v-model:value="pgModal.form.moq_qty" :min="1" style="width:100%"/></a-form-item></a-col>
                  </a-row>
                </template>

                <!-- 组内配件清单：单个添加 + 批量添加（按钮触发弹窗） -->
                <div class="bt-sec-t" style="margin:6px 0 12px;display:flex;align-items:center;">
                  <span>组内配件清单（{{ (pgModal.form.parts||[]).length }}）</span>
                  <span class="bt-sec-sub">统一取每个配件的最新件</span>
                  <a-button size="small" style="margin-left:auto;" @click="pgOpenPaste">⬆ 批量添加配件</a-button>
                </div>
                <a-table :columns="pgPartCols" :data-source="pgModal.form.parts" row-key="part_code" :pagination="false" size="small" bordered>
                  <template #bodyCell="{ column, record }">
                    <template v-if="column.dataIndex==='supplier_code'"><a-input v-model:value="record.supplier_code" size="small" style="width:96px"/></template>
                    <template v-else-if="column.dataIndex==='max_stock_months'"><a-input-number v-model:value="record.max_stock_months" :min="0" :step="0.01" :precision="2" size="small" style="width:110px"/></template>
                    <template v-else-if="column.dataIndex==='_op'"><a @click="pgRemovePart(record)" style="color:#ff4d4f;">删除</a></template>
                  </template>
                </a-table>
                <div style="display:flex;gap:8px;align-items:center;margin-top:10px;">
                  <a-input v-model:value="pgNewPartCode" placeholder="输入配件号后按回车或点击添加" style="width:280px" @press-enter="pgAddPart"/>
                  <a-button @click="pgAddPart">添加配件</a-button>
                </div>

                <!-- 备注与图片（最后部分）：补充说明分组背景、图纸或实物参考 -->
                <div class="bt-sec-t" style="margin:18px 0 12px;">备注与图片<span class="bt-sec-sub">补充说明分组背景、图纸或实物参考</span></div>
                <a-form-item label="备注">
                  <a-textarea v-model:value="pgModal.form.remark" :rows="3" placeholder="可填写分组说明、适用范围、注意事项等" :maxlength="500" show-count/>
                </a-form-item>
                <a-form-item label="图片凭证（最多 6 张）">
                  <a-upload
                    list-type="picture-card"
                    :file-list="pgModal.form.images"
                    :before-upload="pgBeforeImgUpload"
                    @remove="pgRemoveImg"
                    @preview="pgPreviewImg"
                  >
                    <div v-if="(pgModal.form.images||[]).length < pgImgMax">
                      <div style="font-size:22px;line-height:1;">＋</div>
                      <div style="margin-top:6px;">上传</div>
                    </div>
                  </a-upload>
                </a-form-item>
                <div class="jlrs-modal-footer">
                  <a-button @click="pgModal.open=false">取消</a-button>
                  <a-button type="primary" @click="pgSave">保存</a-button>
                </div>
              </a-form>
            </a-modal>

            <!-- 批量添加配件（新增 / 编辑分组内触发）：仅支持 Excel/CSV 导入（配件号 + 最大备货月数） -->
            <a-modal v-model:open="pgPasteOpen" title="批量添加配件 · 配件组" :width="850" :footer="null" :mask-closable="false">
              <a-form layout="vertical">
                <a-form-item label="Excel / CSV 导入">
                  <a-space>
                    <a-button @click="pgPasteExportTemplate"><span style="margin-right:6px;">⬇</span>导出模板</a-button>
                    <a-upload :before-upload="pgPasteImportFile" :show-upload-list="false" accept=".csv,.txt,.xlsx,.xls">
                      <a-button><span style="margin-right:6px;">⬆</span>导入 Excel / CSV</a-button>
                    </a-upload>
                  </a-space>
                  <div v-if="pgPasteRows.length" style="margin-top:12px;">
                    <div class="bt-sec-sub" style="margin-bottom:6px;">已解析 {{ pgPasteRows.length }} 行（配件号 + 最大备货月数）</div>
                    <a-table :columns="pgPastePreviewCols" :data-source="pgPasteRows" row-key="part_code" :pagination="false" size="small" bordered :scroll="{ y: 220 }"/>
                  </div>
                </a-form-item>
              </a-form>
              <div class="jlrs-modal-footer">
                <a-button @click="pgPasteOpen=false">取消</a-button>
                <a-button type="primary" @click="pgPasteAddParts">确认添加</a-button>
              </div>
            </a-modal>

            <a-modal v-model:open="pgDelOpen" title="删除 · 配件组" :width="480" :footer="null" :mask-closable="false">
              <p v-if="pgDelRow" style="margin:0;line-height:1.9;">
                确认删除分组 <b>{{ pgDelRow.group_name }}</b>（{{ pgDelRow.group_code }}）及其组内 {{ (pgDelRow.parts||[]).length }} 个配件？
              </p>
              <div class="jlrs-modal-footer">
                <a-button @click="pgDelOpen=false">取消</a-button>
                <a-button danger type="primary" @click="pgDoDelete">确认删除</a-button>
              </div>
            </a-modal>
          </template>

          <!-- ============ 计划层级管理（计划员 → 计划组 → 供应商） ============ -->
          <template v-else-if="activeMenu==='plan-hier'">
            <div class="toolbar-row">
              <a-input v-model:value="planKeyword" placeholder="搜索计划员 / 计划组 / 供应商" style="width:260px" allow-clear>
                <template #prefix>🔍</template>
              </a-input>
              <span class="spacer"></span>
              <a-button type="primary" @click="openPlanPlannerModal('add')">＋ 新增计划员</a-button>
              <a-button @click="openPlanGroupModal('add')">＋ 新增计划组</a-button>
              <a-button @click="planToggleExpand">{{ planAllExpanded ? '收起全部' : '展开全部' }}</a-button>
              <a-button @click="toggleFull">⛶ 全屏</a-button>
            </div>

            <div class="card ph-wrap">
              <div class="ph-tree">
                <div class="ph-tree-title">层级结构（计划员 → 计划组 → 供应商）</div>
                <div class="ph-tree-body">
                  <div v-for="n in planFlatNodes" :key="n.key"
                       class="tnode"
                       :class="{ sel: planSelectedKeys.includes(n.key) }"
                       :style="{ paddingLeft: (n.depth*22 + 10) + 'px' }"
                       @click="onPlanNodeClick(n)">
                    <span class="tnode-sw" @click.stop="onPlanToggle(n)">
                      <span v-if="n.hasChildren" class="tnode-caret">{{ n.expanded ? '▾' : '▸' }}</span>
                      <span v-else class="tnode-dot">·</span>
                    </span>
                    <span class="tnode-ico">{{ n.type==='planner' ? '👤' : (n.type==='group' ? '📁' : '🏢') }}</span>
                    <span class="tnode-name">{{ n.title }}</span>
                    <span class="tnode-acts">
                      <a v-if="n.type==='group'" @click.stop="openPlanAddSupplier(n.payload.code)">✚供应商</a>
                      <a v-if="n.type!=='supplier'" class="danger" @click.stop="planDeleteNode(n)">删除</a>
                      <a v-if="n.type==='supplier'" class="danger" @click.stop="planRemoveSupplierRel(n.payload.groupCode, n.payload.supplierCode)">移除</a>
                    </span>
                  </div>
                  <div v-if="!planFlatNodes.length" class="ph-empty-sm">无匹配节点</div>
                </div>
              </div>

              <div class="ph-detail">
                <div v-if="!planSel" class="ph-empty">
                  <a-empty description="请选择左侧节点查看 / 编辑其信息与关联关系"/>
                </div>

                <div v-else-if="planSel.type==='planner'" class="ph-form">
                  <div class="blk-section">计划员信息</div>
